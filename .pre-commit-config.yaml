fail_fast: false
default_stages:
  - pre-commit

ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: repo-checks
        name: repo checks
        description: fmt, check, clippy, test, deny and typos, on the template output or on the generated project itself.
        entry: python scripts/validate_repo.py all
        language: python
        files: ^(Cargo\.toml|Cargo\.lock|cargo-generate\.toml|deny\.toml|cliff\.toml|_typos\.toml|LICENSE-MIT|README\.md|src/.*\.rs|scripts/.*\.py|\.github/workflows/.*\.ya?ml)$
        pass_filenames: false
